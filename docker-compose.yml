services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: overclocked-api
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - overclocked-net

  nginx:
    image: nginx:alpine
    container_name: overclocked-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs
    depends_on:
      - api
    networks:
      - overclocked-net

  db:
    image: postgres:18.1-trixie
    container_name: overclocked-db
    restart: always
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - overclocked-net

  redis:
    image: redis:latest
    container_name: overclocked-redis
    restart: always
    networks:
      - overclocked-net

  seq:
    image: datalust/seq:latest
    container_name: overclocked-seq
    restart: always
    env_file:
      - .env
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seqdata:/data
    networks:
      - overclocked-net

volumes:
  pgdata:
    name: overclocked-pgdata
  seqdata:
    name: overclocked-seqdata

networks:
  overclocked-net:
    driver: bridge
    name: overclocked-net
