services:
  db:
    image: postgres:18.1-trixie
    container_name: overclocked-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: post_147_gres
      POSTGRES_DB: OverclockedDB
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - overclocked-net

  redis:
    image: redis:latest
    container_name: overclocked-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - overclocked-net

  seq:
    image: datalust/seq:latest
    container_name: overclocked-seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SEQ_PASSWORD=admin123 # Change this in production ask for new pw admin12345
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seqdata:/data
    networks:
      - overclocked-net

volumes:
  pgdata:
    name: overclocked-pgdata
  seqdata:
    name: overclocked-seqdata

networks:
  overclocked-net:
    driver: bridge
    name: overclocked-net
