# Define the upstream server for your .NET application
upstream api_server {
    # 'app' is the service name from docker-compose.yml
    # '5105' is the internal port the app is listening on
    server app:5105;
}

# Define the upstream server for your Seq UI
upstream seq_server {
    # 'seq' is the service name from docker-compose.yml
    # '80' is the internal port for the Seq UI
    server seq:80;
}


server {
    listen 80;

    # Route all traffic for the root path to your API
    location / {
        proxy_pass http://api_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route all traffic for /seq to the Seq UI
    location /seq/ {
        proxy_pass http://seq_server/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
